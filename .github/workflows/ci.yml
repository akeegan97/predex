name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository sanity check
        run: |
          set -euo pipefail
          echo "CI is configured for the current C++ build graph and optional future Python tooling."
          if [ ! -f cpp/CMakeLists.txt ] && [ ! -f pyproject.toml ] && [ ! -f requirements.txt ]; then
            echo "::warning::No CMake or Python project files found yet."
          fi

  cxx-build-and-tidy:
    name: C++ CMake build + clang-tidy + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect CMake and vcpkg config
        id: detect_cmake
        run: |
          set -euo pipefail
          if [ -f cpp/CMakeLists.txt ]; then
            echo "has_cmake=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cmake=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f cpp/vcpkg.json ]; then
            echo "has_vcpkg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_vcpkg=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install C++ toolchain
        if: ${{ steps.detect_cmake.outputs.has_cmake == 'true' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang clang-tidy

      - name: Verify Ninja/CMake toolchain
        if: ${{ steps.detect_cmake.outputs.has_cmake == 'true' }}
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            echo "ninja missing; installing fallback package..."
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi
          echo "CMake: $(cmake --version | head -n1)"
          echo "Ninja path: $(command -v ninja)"
          echo "Ninja: $(ninja --version)"

      - name: Cache vcpkg artifacts
        if: ${{ steps.detect_cmake.outputs.has_cmake == 'true' && steps.detect_cmake.outputs.has_vcpkg == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg/downloads
            ${{ github.workspace }}/.vcpkg_installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('cpp/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Setup vcpkg
        if: ${{ steps.detect_cmake.outputs.has_cmake == 'true' && steps.detect_cmake.outputs.has_vcpkg == 'true' }}
        run: |
          set -euo pipefail
          # Full clone required - shallow clones break vcpkg port tree resolution via git read-tree.
          # Pinned to builtin-baseline from cpp/vcpkg.json for reproducibility.
          rm -rf "$RUNNER_TEMP/vcpkg"
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout 1e199d32ad53aab1defda61ce41c380302e3f95c
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vcpkg" >> "$GITHUB_PATH"

      - name: Configure (CMake)
        if: ${{ steps.detect_cmake.outputs.has_cmake == 'true' }}
        run: |
          set -euo pipefail
          NINJA_PATH="$(command -v ninja)"
          if [ -f CMakePresets.json ]; then
            if [ -f cpp/vcpkg.json ]; then
              cmake --preset ci-vcpkg -DCMAKE_MAKE_PROGRAM="$NINJA_PATH"
            else
              cmake --preset ci -DCMAKE_MAKE_PROGRAM="$NINJA_PATH"
            fi
          else
            cmake -S cpp -B build/ci -G Ninja -DCMAKE_MAKE_PROGRAM="$NINJA_PATH" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          fi

      - name: Build
        if: ${{ steps.detect_cmake.outputs.has_cmake == 'true' }}
        run: |
          set -euo pipefail
          if [ -f CMakePresets.json ]; then
            if [ -f cpp/vcpkg.json ]; then
              cmake --build --preset build-ci-vcpkg --parallel
            else
              cmake --build --preset build-ci --parallel
            fi
          else
            cmake --build build/ci --parallel
          fi

      - name: clang-tidy
        if: ${{ steps.detect_cmake.outputs.has_cmake == 'true' }}
        run: |
          set -euo pipefail
          mapfile -t cpp_files < <(
            {
              find cpp/src -type f \( -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \);
              if [ -f cpp/apps/trader/main.cpp ]; then
                printf '%s\n' cpp/apps/trader/main.cpp;
              fi
            } | sort -u
          )
          if [ "${#cpp_files[@]}" -eq 0 ]; then
            echo "No C++ implementation files found for clang-tidy."
            exit 0
          fi
          clang-tidy --config-file=.clang-tidy -p build/ci --warnings-as-errors='*' "${cpp_files[@]}"

      - name: Test (ctest)
        if: ${{ steps.detect_cmake.outputs.has_cmake == 'true' }}
        run: |
          set -euo pipefail
          if [ -f CMakePresets.json ]; then
            if [ -f cpp/vcpkg.json ]; then
              ctest --preset test-ci-vcpkg
            else
              ctest --preset test-ci
            fi
          else
            ctest --test-dir build/ci --output-on-failure
          fi

      - name: Skip C++ build/tidy/tests (no CMake project)
        if: ${{ steps.detect_cmake.outputs.has_cmake != 'true' }}
        run: echo "cpp/CMakeLists.txt not found. Skipping C++ build/tidy/tests."
