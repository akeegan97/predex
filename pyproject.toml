[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predex"
version = "0.1.0"
description = "Python discovery and config synthesis tooling for Predex"
requires-python = ">=3.11"

[project.optional-dependencies]
# Tape inspection and config summaries are dependency-free. Materialization
# and metadata route-table rewrites require Arrow explicitly.
replay = [
    "pyarrow==23.0.1",
]

[project.scripts]
predex = "predex.discovery.cli:main"
predex-discovery = "predex.discovery.cli:main"
predex-replay = "predex.replay.cli:main"

[tool.setuptools]
package-dir = {"" = "python/src"}

[tool.setuptools.packages.find]
where = ["python/src"]
